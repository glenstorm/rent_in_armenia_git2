# nginx site for itsfreerealestate.am
# Install:
#   sudo cp deploy/nginx.itsfreerealestate.am.conf /etc/nginx/sites-available/itsfreerealestate.am
#   sudo ln -sf /etc/nginx/sites-available/itsfreerealestate.am /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then: sudo certbot --nginx -d itsfreerealestate.am -d www.itsfreerealestate.am

upstream itsfreerealestate_app {
    server unix:/run/itsfreerealestate/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name itsfreerealestate.am www.itsfreerealestate.am;

    client_max_body_size 10m;

    # After certbot, this block is usually upgraded to HTTPS automatically.
    location /static/ {
        alias /var/www/itsfreerealestate/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
        proxy_pass http://itsfreerealestate_app;
    }
}
