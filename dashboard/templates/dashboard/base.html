<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Yerevan rent statistics{% endblock %}</title>
  <style>
    :root {
      --bg: #f3efe6;
      --ink: #1c2430;
      --accent: #0f6e56;
      --card: #fffdf8;
      --muted: #5c6673;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, #dceee7 0%, transparent 45%),
        linear-gradient(160deg, var(--bg), #e7eef5);
      min-height: 100vh;
    }
    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 2rem 1.25rem 3rem;
    }
    h1 {
      margin: 0 0 0.35rem;
      font-size: 1.9rem;
      letter-spacing: -0.02em;
    }
    .lede {
      margin: 0 0 1.25rem;
      color: var(--muted);
    }
    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 0 0 1.5rem;
      padding: 0;
      list-style: none;
    }
    .nav a {
      display: inline-block;
      padding: 0.45rem 0.9rem;
      border-radius: 8px;
      border: 1px solid #d9d2c4;
      background: #f7f3ea;
      color: var(--ink);
      text-decoration: none;
      font-size: 0.95rem;
    }
    .nav a:hover { border-color: var(--accent); }
    .nav a.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .panel {
      background: var(--card);
      border: 1px solid #d9d2c4;
      border-radius: 12px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.25rem;
    }
    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .stats strong { display: block; font-size: 1.25rem; }
    .stats span { color: var(--muted); font-size: 0.9rem; }
    .district-stats {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.75rem 1rem;
      margin: 0 0 1rem;
      padding: 0;
      list-style: none;
    }
    .district-stats li {
      background: #f7f3ea;
      border: 1px solid #e2d9c8;
      border-radius: 8px;
      padding: 0.65rem 0.8rem;
    }
    .district-stats strong {
      display: block;
      font-size: 1.2rem;
    }
    .district-stats span {
      color: var(--muted);
      font-size: 0.85rem;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
    }
    form.inline {
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem;
      align-items: center;
    }
    label { cursor: pointer; }
    button, .button {
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 0.55rem 1rem;
      cursor: pointer;
      font: inherit;
      text-decoration: none;
      display: inline-block;
    }
    .messages {
      list-style: none;
      margin: 0 0 1rem;
      padding: 0;
    }
    .messages li {
      background: #e7f5ef;
      border: 1px solid #b7dccb;
      border-radius: 8px;
      padding: 0.65rem 0.9rem;
      margin-bottom: 0.5rem;
    }
    .empty {
      padding: 2rem;
      text-align: center;
      color: var(--muted);
    }
    .meta { color: var(--muted); font-size: 0.9rem; }
    .section-title {
      margin: 0 0 0.85rem;
      font-size: 1.15rem;
    }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin: 0 0 1rem;
      padding: 0;
      list-style: none;
    }
    .tabs a {
      display: inline-block;
      padding: 0.4rem 0.75rem;
      border-radius: 8px;
      border: 1px solid #d9d2c4;
      background: #f7f3ea;
      color: var(--ink);
      text-decoration: none;
      font-size: 0.9rem;
    }
    .tabs a:hover { border-color: var(--accent); }
    .tabs a.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .page-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem;
    }
    .page-cards a {
      display: block;
      padding: 1.1rem 1.2rem;
      border-radius: 12px;
      border: 1px solid #d9d2c4;
      background: #f7f3ea;
      color: var(--ink);
      text-decoration: none;
    }
    .page-cards a:hover { border-color: var(--accent); }
    .page-cards strong {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 1.05rem;
    }
    .page-cards span { color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Yerevan rent statistics</h1>
    <p class="lede">{% block lede %}Listings gathered from list.am.{% endblock %}</p>

    <ul class="nav">
      <li><a href="{% url 'home' %}" class="{% if nav == 'home' %}active{% endif %}">Overview</a></li>
      <li><a href="{% url 'trends' %}" class="{% if nav == 'trends' %}active{% endif %}">Price trends by district</a></li>
      <li><a href="{% url 'distribution' %}" class="{% if nav == 'distribution' %}active{% endif %}">Current distribution by rooms</a></li>
    </ul>

    {% if messages %}
      <ul class="messages">
        {% for message in messages %}
          <li>{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
